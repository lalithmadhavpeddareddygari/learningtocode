const viewport = document.getElementById("viewport");
const notesEl = document.getElementById("notes");
const counter = document.getElementById("counter");
let i = 0;
function render() {
  viewport.innerHTML = slides[i].html;
  viewport.querySelector(".slide")?.classList.add("active");
  notesEl.textContent = "Notes: " + slides[i].notes;
  counter.textContent = (i + 1) + " / " + slides.length;
}
document.getElementById("prev").onclick = () => { i = (i + slides.length - 1) % slides.length; render(); };
document.getElementById("next").onclick = () => { i = (i + 1) % slides.length; render(); };
document.getElementById("notesBtn").onclick = () => notesEl.classList.toggle("on");
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); i = (i + 1) % slides.length; render(); }
  if (e.key === "ArrowLeft") { i = (i + slides.length - 1) % slides.length; render(); }
});
render();
</script>
